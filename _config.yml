title: Plume — Informations légales
description: Politique de confidentialité, conditions générales et suppression de compte de l'application Plume.
theme: jekyll-theme-cayman
lang: fr

# ── LE BANDEAU PARLE LA LANGUE DE LA PAGE ───────────────────────────────
#
# GitHub Pages DÉDUIT le titre de la première ligne « # » du fichier, donc il
# était déjà traduit. La DESCRIPTION, elle, n'est jamais déduite : le gabarit
# retombait sur celle du site et affichait du français sur les 59 autres
# langues, sur les trois pages de chacune (constat du fondateur, capture à
# l'appui, 10/08/2026).
#
# Deux défauts de la même racine sont corrigés ici : `lang` valait « fr »
# partout — un lecteur d'écran annonçait donc l'arabe en français — et aucune
# page n'était marquée RTL, d'où les adresses et e-mails désordonnés.
#
# Porté par le DOSSIER : aucune des ~180 pages n'a besoin d'en-tête, et une
# langue ajoutée demain ne demandera qu'une entrée ici.
