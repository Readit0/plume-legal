<!DOCTYPE html>
<!--
  [10/08/2026] `dir` AJOUTÉ. Sans lui, les pages arabe, persane, hébraïque et
  ourdoue étaient rendues de gauche à droite : visible sur la capture du
  fondateur, où l'adresse postale et l'e-mail se mêlaient au texte arabe
  (« …18100 Vierzon, France جهة الاتصال: »). Le sens de lecture est porté par le
  dossier de langue (bloc `defaults` de _config.yml), comme `lang` et
  `description`. Défaut « ltr » : une langue sans réglage garde EXACTEMENT le
  rendu qu'elle avait.
-->
<html lang="{{ page.lang | default: site.lang | default: "fr" }}" dir="{{ page.dir | default: "ltr" }}">
  <head>
    <meta charset="UTF-8">

{% seo %}
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link rel="preload" href="https://fonts.googleapis.com/css?family=Open+Sans:400,700&display=swap" as="style" type="text/css" crossorigin>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#157878">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
    {% include head-custom.html %}
  </head>
  <body>
    <a id="skip-to-content" href="#content">{{ page.skip_label | default: "Aller au contenu." }}</a>

    <header class="page-header" role="banner">
      <h1 class="project-name">{{ page.title | default: site.title }}</h1>
      <h2 class="project-tagline">{{ page.description | default: site.description }}</h2>
    </header>

    <main id="content" class="main-content" role="main">
      {{ content }}
    </main>
  </body>
</html>
