<style>

(function () {
  var T = {"af":["Jou Plume-rekening is bevestig","Jou e-posadres is geverifieer. Gaan terug na die Plume-app en meld aan. Jy kan hierdie bladsy toemaak.","Hierdie skakel is nie meer geldig nie","Dit het verval of is reeds gebruik. Registreer weer in Plume om 'n nuwe skakel te kry. Kyk ook in jou gemorspos."],"ar":["تم تأكيد حسابك في Plume","تم التحقق من عنوان بريدك الإلكتروني. عد إلى تطبيق Plume وسجّل الدخول. يمكنك إغلاق هذه الصفحة.","لم يعد هذا الرابط صالحًا","لقد انتهت صلاحيته أو تم استخدامه من قبل. أعد التسجيل في Plume للحصول على رابط جديد. تذكّر التحقق من مجلد الرسائل غير المرغوب فيها."],"be":["Ваш уліковы запіс Plume пацверджаны","Ваш адрас электроннай пошты пацверджаны. Вярніцеся ў праграму Plume і ўвайдзіце. Вы можаце закрыць гэту старонку.","Гэтая спасылка больш не дзейнічае","Тэрмін яе дзеяння скончыўся або яна ўжо выкарыстана. Паўтарыце рэгістрацыю ў Plume, каб атрымаць новую спасылку. Не забудзьцеся праверыць папку са спамам."],"bg":["Профилът ви в Plume е потвърден","Имейл адресът ви е потвърден. Върнете се в приложението Plume и влезте. Можете да затворите тази страница.","Тази връзка вече не е валидна","Изтекла е или вече е използвана. Регистрирайте се отново в Plume, за да получите нова връзка. Не забравяйте да проверите папката със спам."],"bn":["আপনার Plume অ্যাকাউন্ট নিশ্চিত হয়েছে","আপনার ইমেল ঠিকানা যাচাই করা হয়েছে। Plume অ্যাপে ফিরে গিয়ে সাইন ইন করুন। আপনি এই পৃষ্ঠাটি বন্ধ করতে পারেন।","এই লিঙ্কটি আর বৈধ নয়","এটির মেয়াদ শেষ হয়ে গেছে বা এটি আগেই ব্যবহার করা হয়েছে। নতুন লিঙ্ক পেতে Plume-এ আবার সাইন আপ করুন। আপনার স্প্যাম ফোল্ডারটি দেখতে ভুলবেন না।"],"ca":["El teu compte de Plume està confirmat","La teva adreça electrònica s'ha verificat. Torna a l'aplicació Plume i inicia la sessió. Pots tancar aquesta pàgina.","Aquest enllaç ja no és vàlid","Ha caducat o ja s'ha fet servir. Torna a registrar-te a Plume per rebre un enllaç nou. Recorda mirar la carpeta de correu brossa."],"cs":["Váš účet Plume je potvrzen","Vaše e-mailová adresa byla ověřena. Vraťte se do aplikace Plume a přihlaste se. Tuto stránku můžete zavřít.","Tento odkaz už není platný","Vypršel nebo už byl použit. Zaregistrujte se v Plume znovu a obdržíte nový odkaz. Nezapomeňte zkontrolovat složku se spamem."],"cy":["Mae dy gyfrif Plume wedi'i gadarnhau","Mae dy gyfeiriad e-bost wedi'i wirio. Dos yn ôl i ap Plume a mewngofnodi. Gelli gau'r dudalen hon.","Nid yw'r ddolen hon yn ddilys mwyach","Mae wedi dod i ben neu wedi'i defnyddio eisoes. Cofrestra eto yn Plume i gael dolen newydd. Cofia edrych yn dy ffolder sbam."],"da":["Din Plume-konto er bekræftet","Din e-mailadresse er bekræftet. Gå tilbage til Plume-appen, og log ind. Du kan lukke denne side.","Dette link er ikke længere gyldigt","Det er udløbet eller allerede brugt. Tilmeld dig igen i Plume for at få et nyt link. Husk at kigge i din spammappe."],"de":["Dein Plume-Konto ist bestätigt","Deine E-Mail-Adresse wurde bestätigt. Kehre zur Plume-App zurück und melde dich an. Du kannst diese Seite schließen.","Dieser Link ist nicht mehr gültig","Er ist abgelaufen oder wurde bereits verwendet. Registriere dich erneut in Plume, um einen neuen Link zu erhalten. Sieh auch im Spam-Ordner nach."],"el":["Ο λογαριασμός σας στο Plume επιβεβαιώθηκε","Η διεύθυνση email σας επαληθεύτηκε. Επιστρέψτε στην εφαρμογή Plume και συνδεθείτε. Μπορείτε να κλείσετε αυτή τη σελίδα.","Αυτός ο σύνδεσμος δεν ισχύει πλέον","Έχει λήξει ή έχει ήδη χρησιμοποιηθεί. Κάντε ξανά εγγραφή στο Plume για να λάβετε νέο σύνδεσμο. Μην ξεχάσετε να ελέγξετε τον φάκελο ανεπιθύμητης αλληλογραφίας."],"en":["Your Plume account is confirmed","Your email address has been verified. Go back to the Plume app and sign in. You can close this page.","This link is no longer valid","It has expired or was already used. Sign up again in Plume to get a new link. Remember to check your spam folder."],"eo":["Via Plume-konto estas konfirmita","Via retpoŝtadreso estas kontrolita. Reiru al la aplikaĵo Plume kaj ensalutu. Vi povas fermi ĉi tiun paĝon.","Ĉi tiu . Ná déan dearmad féachaint i bhfillteán an turscair."],"gl":["A túa conta de Plume está confirmada","O teu enderezo de correo foi verificado. Volve á aplicación Plume e inicia sesión. Podes pechar esta páxina.","Esta ligazón xa non é válida","Caducou ou xa se usou. Rexístrate de novo en Plume para recibir unha ligazón nova. Lembra mirar no cartafol de correo lixo."],"gu":["તમારું Plume ખાતું પુષ્ટિ થયું છે","તમારું ઇમેઇલ સરનામું ચકાસાયું છે. Plume એપ પર પાછા જાઓ અને સાઇન ઇન કરો. તમે આ પૃષ્ઠ બંધ કરી શકો છો.","આ લિંક હવે માન્ય નથી","તેની મુદત પૂરી થઈ ગઈ છે અથવા તે પહેલેથી વપરાઈ ગઈ છે. નવી લિંક મેળવવા Plume માં ફરીથી સાઇન અપ કરો. તમારું સ્પામ ફોલ્ડર જોવાનું ભૂલશો નહીં."],"he":["חשבון Plume שלך אושר","כתובת האימייל שלך אומתה. חזור לאפליקציית Plume והתחבר. אפשר לסגור את הדף הזה.","הקישור הזה כבר אינו תקף","תוקפו פג או שכבר נעשה בו שימוש. הירשם שוב ב-Plume כדי לקבל קישור חדש. אל תשכח לבדוק בתיקיית דואר הזבל."],"hi":["आपका Plume खाता सत्यापित हो गया है","आपका ईमेल पता सत्यापित हो गया है। Plume ऐप पर वापस जाएँ और साइन इन करें। आप यह पेज बंद कर सकते हैं।","यह लिंक अब मान्य नहीं है","इसकी अवधि समाप्त हो गई है या इसका पहले ही उपयोग हो चुका है। नया लिंक पाने के लिए Plume में दोबारा साइन अप करें। अपना स्पैम फ़ोल्डर देखना न भूलें।"],"hr":["Vaš Plume račun je potvrđen","Vaša e-mail adresa je potvrđena. Vratite se u aplikaciju Plume i prijavite se. Ovu stranicu možete zatvoriti.","Ova poveznica više nije važeća","Istekla je ili je već iskorištena. Ponovno se registrirajte u Plumeu da biste dobili novu poveznicu. Ne zaboravite provjeriti mapu neželjene pošte."],"ht":["Kont Plume ou konfime","Adrès imèl ou verifye. Retounen nan aplikasyon Plume a epi konekte. Ou ka fèmen paj sa a.","Lyen sa a pa valab ankò","Li ekspire oswa li deja sèvi. Enskri ankò nan Plume pou resevwa yon nouvo lyen. Sonje gade nan dosye spam ou."],"hu":["A Plume-fiókod megerősítve","Az e-mail-címed ellenőrizve. Térj vissza a Plume alkalmazásba, és jelentkezz be. Ezt az oldalt bezárhatod.","Ez a link már nem érvényes","Lejárt, vagy már felhasználták. Regisztrálj újra a Plume-ban új linkért. Ne felejtsd el megnézni a spam mappát."],"id":["Akun Plume Anda telah dikonfirmasi","Alamat email Anda telah diverifikasi. Kembali ke aplikasi Plume dan masuk. Anda dapat menutup halaman ini.","Tautan ini tidak berlaku lagi","Tautan sudah kedaluwarsa atau sudah digunakan. Daftar lagi di Plume untuk mendapatkan tautan baru. Jangan lupa periksa folder spam Anda."],"is":["Plume-reikningurinn þinn er staðfestur","Netfangið þitt hefur verið staðfest. Farðu aftur í Plume-appið og skráðu þig inn. Þú mátt loka þessari síðu.","Þessi hlekkur er ekki lengur gildur","Hann er útrunninn eða þegar notaður. Skráðu þig aftur í Plume til að fá nýjan hlekk. Mundu að athuga ruslpóstmöppuna."],"it":["Il tuo account Plume è confermato","Il tuo indirizzo e-mail è stato verificato. Torna nell'app Plume e accedi. Puoi chiudere questa pagina.","Questo link non è più valido","È scaduto o è già stato usato. Ripeti la registrazione in Plume per ricevere un nuovo link. Ricordati di controllare la cartella spam."],"ja":["Plume アカウントが確認されました","メールアドレスの確認が完了しました。Plume アプリに戻ってログインしてください。このページは閉じて構いません。","このリンクは無効です","有効期限が切れているか、すでに使用されています。新しいリンクを受け取るには、Plume でもう一度登録してください。迷惑メールフォルダもご確認ください。"],"ka":["თქვენი Plume ანგარიში დადასტურებულია","თქვენი ელფოსტის მისამართი დადასტურდა. დაბრუნდით Plume აპლიკაციაში და შედით. შეგიძლიათ დახუროთ ეს გვერდი.","ეს ბმული აღარ მოქმედებს","მისი ვადა ამოიწურა ან უკვე გამოყენებულია. ხელახლა დარეგისტრირდით Plume-ში ახალი ბმულის მისაღებად. არ დაგავიწყდეთ სპამის საქაღალდის შემოწმება."],"kn":["ನಿಮ್ಮ Plume ಖಾತೆ ದೃಢೀಕರಿಸಲಾಗಿದೆ","ನಿಮ್ಮ ಇಮೇಲ್ ವಿಳಾಸವನ್ನು ಪರಿಶೀಲಿಸಲಾಗಿದೆ. Plume ಅಪ್ಲಿಕೇಶನ್‌ಗೆ ಹಿಂತಿರುಗಿ ಮತ್ತು ಸೈನ್ ಇನ್ ಮಾಡಿ. ನೀವು ಈ ಪುಟವನ್ನು ಮುಚ್ಚಬಹುದು.","ಈ ಲಿಂಕ್ ಇನ್ನು ಮಾನ್ಯವಾಗಿಲ್ಲ","ಅದರ ಅವಧಿ ಮುಗಿದಿದೆ ಅಥವಾ ಈಗಾಗಲೇ ಬಳಸಲಾಗಿದೆ. ಹೊಸ ಲಿಂಕ್ ಪಡೆಯಲು Plume ನಲ್ಲಿ ಮತ್ತೆ ಸೈನ್ ಅಪ್ ಮಾಡಿ. ನಿಮ್ಮ ಸ್ಪ್ಯಾಮ್ ಫೋಲ್ಡರ್ ಪರಿಶೀಲಿಸಲು ಮರೆಯಬೇಡಿ."],"ko":["Plume 계정이 확인되었습니다","이메일 주소가 확인되었습니다. Plume 앱으로 돌아가 로그인하세요. 이 페이지는 닫으셔도 됩니다.","이 링크는 더 이상 유효하지 않습니다","만료되었거나 이미 사용되었습니다. 새 링크를 받으려면 Plume에서 다시 가입하세요. 스팸 편지함도 확인해 주세요."],"lt":["Jūsų Plume paskyra patvirtinta","Jūsų el. pašto adresas patvirtintas. Grįžkite į Plume programėlę ir prisijunkite. Šį puslapį galite uždaryti.","Ši nuoroda nebegalioja","Jos galiojimas baigėsi arba ji jau panaudota. Užsiregistruokite Plume dar kartą, kad gautumėte naują nuorodą. Nepamirškite patikrinti šlamšto aplanko."],"lv":["Jūsu Plume konts ir apstiprināts","Jūsu e-pasta adrese ir apstiprināta. Atgriezieties Plume lietotnē un piesakieties. Šo lapu varat aizvērt.","Šī saite vairs nav derīga","Tā ir beigusies vai jau izmantota. Reģistrējieties Plume vēlreiz, lai saņemtu jaunu saiti. Neaizmirstiet pārbaudīt mēstuļu mapi."],"mk":["Вашата сметка на Plume е потврдена","Вашата е-пошта е потврдена. Вратете се во апликацијата Plume и најавете се. Можете да ја затворите оваа страница.","Оваа врска повеќе не важи","Истече или веќе е искористена. Регистрирајте се повторно во Plume за да добиете нова врска. Не заборавајте да ја проверите папката со спам."],"mr":["तुमचे Plume खाते निश्चित झाले आहे","तुमचा ईमेल पत्ता सत्यापित झाला आहे. Plume अ‍ॅपवर परत जा आणि साइन इन करा. तुम्ही हे पृष्ठ बंद करू शकता.","ही लिंक आता वैध नाही","तिची मुदत संपली आहे किंवा ती आधीच वापरली गेली आहे. नवीन लिंक मिळवण्यासाठी Plume मध्ये पुन्हा साइन अप करा. तुमचा स्पॅम फोल्डर पाहायला विसरू नका."],"ms":["Akaun Plume anda telah disahkan","Alamat e-mel anda telah disahkan. Kembali ke aplikasi Plume dan log masuk. Anda boleh menutup halaman ini.","Pautan ini tidak sah lagi","Ia telah tamat tempoh atau telah digunakan. Daftar semula dalam Plume untuk mendapatkan pautan baharu. Jangan lupa semak folder spam anda."],"mt":["Il-kont Plume tiegħek ġie kkonfermat","L-indirizz tal-email tiegħek ġie vverifikat. Erġa' lura fl-app Plume u idħol. Tista' tagħlaq din il-paġna.","Din il-link m'għadhiex valida","Skadiet jew diġà ntużat. Irreġistra mill-ġdid fi Plume biex tirċievi link ġdida. Ftakar tiċċekkja l-folder tal-ispam."],"nl":["Je Plume-account is bevestigd","Je e-mailadres is geverifieerd. Ga terug naar de Plume-app en log in. Je kunt deze pagina sluiten.","Deze link is niet meer geldig","Hij is verlopen of al gebruikt. Meld je opnieuw aan in Plume om een nieuwe link te ontvangen. Kijk ook in je spammap."],"no":["Plume-kontoen din er bekreftet","E-postadressen din er bekreftet. Gå tilbake til Plume-appen og logg inn. Du kan lukke denne siden.","Denne lenken er ikke lenger gyldig","Den er utløpt eller allerede brukt. Registrer deg på nytt i Plume for å få en ny lenke. Husk å sjekke søppelpostmappen."],"pa":["ਤੁਹਾਡਾ Plume ਖਾਤਾ ਪੁਸ਼ਟੀ ਹੋ ਗਿਆ ਹੈ","ਤੁਹਾਡਾ ਈਮੇਲ ਪਤਾ ਤਸਦੀਕ ਹੋ ਗਿਆ ਹੈ। Plume ਐਪ 'ਤੇ ਵਾਪਸ ਜਾਓ ਅਤੇ ਸਾਈਨ ਇਨ ਕਰੋ। ਤੁਸੀਂ ਇਹ ਪੰਨਾ ਬੰਦ ਕਰ ਸਕਦੇ ਹੋ।","ਇਹ ਲਿੰਕ ਹੁਣ ਵੈਧ ਨਹੀਂ ਹੈ","ਇਸਦੀ ਮਿਆਦ ਪੁੱਗ ਗਈ ਹੈ ਜਾਂ ਇਹ ਪਹਿਲਾਂ ਹੀ ਵਰਤਿਆ ਜਾ ਚੁੱਕਾ ਹੈ। ਨਵਾਂ ਲਿੰਕ ਲੈਣ ਲਈ Plume ਵਿੱਚ ਦੁਬਾਰਾ ਸਾਈਨ ਅੱਪ ਕਰੋ। ਆਪਣਾ ਸਪੈਮ ਫੋਲਡਰ ਦੇਖਣਾ ਨਾ ਭੁੱਲੋ।"],"pl":["Twoje konto Plume zostało potwierdzone","Twój adres e-mail został zweryfikowany. Wróć do aplikacji Plume i zaloguj się. Możesz zamknąć tę stronę.","Ten link nie jest już ważny","Wygasł lub został już użyty. Zarejestruj się ponownie w Plume, aby otrzymać nowy link. Pamiętaj, aby sprawdzić folder ze spamem."],"pt":["A tua conta Plume está confirmada","O teu endereço de e-mail foi verificado. Volta à aplicação Plume e inicia sessão. Podes fechar esta página.","Este link já não é válido","Expirou ou já foi utilizado. Faz novamente o registo no Plume para receber um novo link. Não te esqueças de ver a pasta de spam."],"ro":["Contul tău Plume este confirmat","Adresa ta de e-mail a fost verificată. Întoarce-te în aplicația Plume și conectează-te. Poți închide această pagină.","Acest link nu mai este valabil","A expirat sau a fost deja folosit. Înregistrează-te din nou în Plume pentru a primi un link nou. Nu uita să verifici folderul de spam."],"ru":["Ваш аккаунт Plume подтверждён","Ваш адрес электронной почты подтверждён. Вернитесь в приложение Plume и войдите. Эту страницу можно закрыть.","Эта ссылка больше не действует","Срок её действия истёк или она уже использована. Зарегистрируйтесь в Plume ещё раз, чтобы получить новую ссылку. Не забудьте проверить папку «Спам»."],"sk":["Váš účet Plume je potvrdený","Vaša e-mailová adresa bola overená. Vráťte sa do aplikácie Plume a prihláste sa. Túto stránku môžete zavrieť.","Tento odkaz už nie je platný","Vypršal alebo už bol použitý. Zaregistrujte sa v Plume znova a dostanete nový odkaz. Nezabudnite skontrolovať priečinok so spamom."],"sl":["Vaš račun Plume je potrjen","Vaš e-poštni naslov je bil potrjen. Vrnite se v aplikacijo Plume in se prijavite. To stran lahko zaprete.","Ta povezava ni več veljavna","Potekla je ali je bila že uporabljena. Znova se registrirajte v Plume, da prejmete novo povezavo. Ne pozabite preveriti mape z neželeno pošto."],"sq":["Llogaria jote Plume është konfirmuar","Adresa jote e email-it është verifikuar. Kthehu në aplikacionin Plume dhe hyr. Mund ta mbyllësh këtë faqe.","Kjo lidhje nuk është më e vlefshme","Ka skaduar ose është përdorur tashmë. Regjistrohu përsëri në Plume për të marrë një lidhje të re. Mos harro të kontrollosh dosjen e spam-it."],"sv":["Ditt Plume-konto är bekräftat","Din e-postadress har bekräftats. Gå tillbaka till Plume-appen och logga in. Du kan stänga den här sidan.","Den här länken är inte längre giltig","Den har gått ut eller redan använts. Registrera dig igen i Plume för att få en ny länk. Kom ihåg att titta i skräppostmappen."],"sw":["Akaunti yako ya Plume imethibitishwa","Anwani yako ya barua pepe imethibitishwa. Rudi kwenye programu ya Plume na uingie. Unaweza kufunga ukurasa huu.","Kiungo hiki hakitumiki tena","Muda wake umeisha au kimetumika tayari. Jisajili tena katika Plume ili upate kiungo kipya. Kumbuka kuangalia folda ya barua taka."],"ta":["உங்கள் Plume கணக்கு உறுதிசெய்யப்பட்டது","உங்கள் மின்னஞ்சல் முகவரி சரிபார்க்கப்பட்டது. Plume செயலிக்குத் திரும்பி உள்நுழையவும். இந்தப் பக்கத்தை மூடலாம்.","இந்த இணைப்பு இனி செல்லுபடியாகாது","அதன் காலம் முடிந்துவிட்டது அல்லது ஏற்கெனவே பயன்படுத்தப்பட்டுவிட்டது. புதிய இணைப்பைப் பெற Plume இல் மீண்டும் பதிவு செய்யவும். உங்கள் ஸ்பேம் கோப்புறையைப் பார்க்க மறக்காதீர்கள்."],"te":["మీ Plume ఖాతా నిర్ధారించబడింది","మీ ఇమెయిల్ చిరునామా ధృవీకరించబడింది. Plume యాప్‌కు తిరిగి వెళ్లి సైన్ ఇన్ చేయండి. మీరు ఈ పేజీని మూసివేయవచ్చు.","ఈ లింక్ ఇకపై చెల్లదు","దీని గడువు ముగిసింది లేదా ఇది ఇప్పటికే ఉపయోగించబడింది. కొత్త లింక్ పొందడానికి Plume లో మళ్లీ సైన్ అప్ చేయండి. మీ స్పామ్ ఫోల్డర్‌ను చూడటం మర్చిపోకండి."],"th":["บัญชี Plume ของคุณได้รับการยืนยันแล้ว","ที่อยู่อีเมลของคุณได้รับการยืนยันแล้ว กลับไปที่แอป Plume แล้วเข้าสู่ระบบ คุณปิดหน้านี้ได้","ลิงก์นี้ใช้ไม่ได้อีกต่อไป","ลิงก์หมดอายุหรือถูกใช้ไปแล้ว สมัครใหม่ใน Plume เพื่อรับลิงก์ใหม่ อย่าลืมตรวจสอบโฟลเดอร์สแปม"],"tl":["Nakumpirma na ang iyong Plume account","Na-verify na ang iyong email address. Bumalik sa Plume app at mag-sign in. Maaari mo nang isara ang pahinang ito.","Hindi na valid ang link na ito","Nag-expire na ito o nagamit na. Mag-sign up ulit sa Plume para makakuha ng bagong link. Tandaan na tingnan ang iyong spam folder."],"tr":["Plume hesabın onaylandı","E-posta adresin doğrulandı. Plume uygulamasına dön ve giriş yap. Bu sayfayı kapatabilirsin.","Bu bağlantı artık geçerli değil","Süresi doldu ya da daha önce kullanıldı. Yeni bir bağlantı almak için Plume'da yeniden kaydol. Spam klasörünü kontrol etmeyi unutma."],"uk":["Ваш обліковий запис Plume підтверджено","Вашу адресу електронної пошти підтверджено. Поверніться до застосунку Plume та увійдіть. Цю сторінку можна закрити.","Це посилання більше не дійсне","Термін його дії минув або воно вже використане. Зареєструйтеся в Plume ще раз, щоб отримати нове посилання. Не забудьте перевірити папку зі спамом."],"ur":["آپ کا Plume اکاؤنٹ تصدیق شدہ ہے","آپ کا ای میل پتہ تصدیق ہو گیا ہے۔ Plume ایپ پر واپس جائیں اور سائن اِن کریں۔ آپ یہ صفحہ بند کر سکتے ہیں۔","یہ لنک اب کارآمد نہیں رہا","اس کی میعاد ختم ہو چکی ہے یا یہ پہلے ہی استعمال ہو چکا ہے۔ نیا لنک حاصل کرنے کے لیے Plume میں دوبارہ سائن اپ کریں۔ اپنا سپیم فولڈر دیکھنا نہ بھولیں۔"],"vi":["Tài khoản Plume của bạn đã được xác nhận","Địa chỉ email của bạn đã được xác minh. Hãy quay lại ứng dụng Plume và đăng nhập. Bạn có thể đóng trang này.","Liên kết này không còn hiệu lực","Liên kết đã hết hạn hoặc đã được sử dụng. Hãy đăng ký lại trong Plume để nhận liên kết mới. Đừng quên kiểm tra thư mục spam."],"zh":["你的 Plume 账户已确认","你的电子邮件地址已验证。请返回 Plume 应用并登录。你可以关闭此页面。","此链接已失效","链接已过期或已被使用。请在 Plume 中重新注册以获取新链接。别忘了查看垃圾邮件文件夹。"]};
  var RTL = ["ar", "fa", "he", "ur"];

  // --- 1. Succes ou lien mort ? -------------------------------------------
  // Supabase place l'echec soit dans le fragment (#error=...), soit dans la
  // query (?error=...). On regarde les DEUX : afficher « compte confirme » sur
  // un lien expire serait exactement le mensonge que cette page doit eviter.
  var params = String(window.location.hash || "").replace(/^#/, "") + "&" +
               String(window.location.search || "").replace(/^\?/, "");
  var enErreur = /(^|&)error(_code|_description)?=/.test(params);

  // --- 2. Quelle langue ? --------------------------------------------------
  // ?lang=xx d'abord (l'app pourra le passer via emailRedirectTo), puis les
  // langues du navigateur, repli francais — langue de reference de Plume.
  function choisir() {
    var force = /(^|[&?])lang=([A-Za-z-]+)/.exec(params);
    var cands = [];
    if (force) { cands.push(force[2]); }
    var nav = window.navigator || {};
    var liste = nav.languages || [nav.language || nav.userLanguage || ""];
    for (var i = 0; i < liste.length; i++) { cands.push(liste[i]); }
    for (var j = 0; j < cands.length; j++) {
      var code = String(cands[j] || "").toLowerCase().replace("_", "-");
      if (T[code]) { return code; }        // ex. "pt"
      var base = code.split("-")[0];       // ex. "pt-br" -> "pt"
      if (T[base]) { return base; }
    }
    return "fr";
  }

  var lang = choisir();
  var txt = T[lang];

  document.getElementById("p-titre").textContent = enErreur ? txt[2] : txt[0];
  document.getElementById("p-corps").textContent = enErreur ? txt[3] : txt[1];
  if (enErreur) {
    document.getElementById("ic-ok").style.display = "none";
    document.getElementById("ic-err").style.display = "block";
  }

  var racine = document.documentElement;
  racine.setAttribute("lang", lang);
  racine.setAttribute("dir", RTL.indexOf(lang) >= 0 ? "rtl" : "ltr");

  // --- 3. Hygiene ----------------------------------------------------------
  // Le fragment de succes transporte un access_token de session REEL. Cette
  // page n'en a aucun usage : on le retire de la barre d'adresse des qu'il est
  // lu, pour qu'il ne reste pas dans l'historique du navigateur.
  if (window.history && window.history.replaceState) {
    window.history.replaceState(null, "", window.location.pathname);
  }
})();
